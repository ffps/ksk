plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ffps.ksk'
    compileSdk 33

    defaultConfig {
        applicationId 'com.ffps.ksk'
        minSdk 17
        targetSdk 33
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
